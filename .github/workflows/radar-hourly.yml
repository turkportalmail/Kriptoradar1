name: 10 Dakikalik Radar Taramasi
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-radar-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kod ve arayuz kontrolu
        run: |
          python -m py_compile public_scanner.py
          python -m json.tool manifest.webmanifest > /dev/null
          python -m json.tool signals.json > /dev/null
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert html.count('<script>')==html.count('</script>')==1
          assert html.count('</html>')==1
          assert 'id="signals"' in html and 'id="tradeForm"' in html
          Path('/tmp/radar-app.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/radar-app.js
      - name: Piyasayi tara
        run: python public_scanner.py
      - name: Sonuclari yayinla
        run: |
          git config user.name 'kripto-radar-bot'
          git config user.email 'kripto-radar-bot@users.noreply.github.com'
          cp signals.json /tmp/radar-signals.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/radar-signals.json signals.json
            git add signals.json
            if git diff --cached --quiet; then
              echo 'No new signal changes'
              exit 0
            fi
            git commit -m 'Update 10-minute radar signals'
            if git push origin HEAD:main; then
              echo 'Radar results published'
              exit 0
            fi
            echo "Concurrent update; retry $attempt"
            sleep 2
          done
          echo 'Could not publish after 5 attempts' >&2
          exit 1
