name: Saatlik Radar Verileri
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-radar-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Piyasayi tara
        run: python public_scanner.py
      - name: Sonuclari yayinla
        run: |
          git config user.name 'kripto-radar-bot'
          git config user.email 'kripto-radar-bot@users.noreply.github.com'
          git add signals.json
          git diff --cached --quiet || (git commit -m 'Update hourly public radar signals' && git push)
