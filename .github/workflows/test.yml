name: Radar Kod Testleri
on:
  push:
    paths:
      - 'public_scanner.py'
      - 'index.html'
      - 'test_radar.py'
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and unit tests
        run: |
          python -m py_compile public_scanner.py test_radar.py
          python -m unittest -v test_radar.py
      - name: HTML and JS validation
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert html.count('<script>')==html.count('</script>')==1
          assert html.count('</html>')==1
          assert 'id="signals"' in html and 'id="tradeForm"' in html
          Path('/tmp/radar-app.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/radar-app.js
